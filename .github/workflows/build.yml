name: Tomodachi-Native - IPA Builder

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: "Title ID del juego (por defecto Tomodachi: 010051F0207B2000)"
        required: false
        type: string
        default: "010051F0207B2000"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout tomodachi-native
        uses: actions/checkout@v4
        with:
          repository: kuosuko/tomodachi-native
          ref: 5587d1bd8e311b5508ed4e8d5310796523d06ed6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies and build hactool
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross unar cmake pkg-config
          python -m pip install --upgrade pip
          python -m pip install lz4 capstone fonttools zstandard backports.zstd gdown

          git clone --depth 1 https://github.com/SciresM/hactool.git "$RUNNER_TEMP/hactool"
          cd "$RUNNER_TEMP/hactool"
          cp config.mk.template config.mk
          make -j"$(sysctl -n hw.ncpu)"
          sudo cp hactool /usr/local/bin/

      - name: Download game files and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local output="$2"

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            if [[ "$url" =~ drive\.google\.com ]]; then
              local file_id
              file_id="$(python - "$url" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse, parse_qs

          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None

          if parsed.netloc.lower() in ("drive.google.com", "www.drive.google.com"):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]

          if not file_id and re.fullmatch(r"[-A-Za-z0-9_]{20,}", url):
              file_id = url

          if not file_id:
              raise SystemExit("Could not extract a Google Drive file ID.")

          print(file_id)
          PY
          )"
              echo "Downloading $(basename "$output") via gdown..."
              gdown "$file_id" -O "$output"
            else
              if [[ "$url" =~ dropbox\.com ]]; then
                url="${url/\?dl=0/?dl=1}"
                url="${url/&dl=0/&dl=1}"
                if [[ ! "$url" =~ dl=1 ]]; then
                  url="${url}?dl=1"
                fi
              fi

              echo "Downloading $(basename "$output") via direct link..."
              curl -L -f --retry 3 --retry-delay 5 -o "$output" "$url"
            fi

            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            file "$output"
          }

          download_file "$GAME_URL" "$WORK/game.download"
          download_file "$KEYS_URL" "$WORK/prod.keys"

          if [[ -n "${UPDATE_URL:-}" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          fi

          if [[ -n "${DLC_URL:-}" ]]; then
            download_file "$DLC_URL" "$WORK/dlc.download"
          fi

          chmod 600 "$WORK/prod.keys"

      - name: Extract NSP or XCI into ExeFS and RomFS
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_ID="${PROFILE_OVERRIDE:-010051F0207B2000}"
          PROFILE_ID="$(echo "$PROFILE_ID" | tr '[:lower:]' '[:upper:]')"

          WORK="$RUNNER_TEMP/nxnative"
          PKG_DIR="$RUNNER_TEMP/Packages"
          EXTRACTED_GAME="$RUNNER_TEMP/ExtractedGame"
          mkdir -p "$PKG_DIR" "$EXTRACTED_GAME/exefs" "$EXTRACTED_GAME/romfs"

          python - "$WORK" "$PKG_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          pkg_dir = Path(sys.argv[2])
          archive_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
              b"PK\x03\x04",
              b"7z\xbc\xaf\x27\x1c",
          )

          for label in ("game", "update"):
              source = work / f"{label}.download"
              if not source.exists():
                  continue

              with source.open("rb") as f:
                  sig = f.read(8)
                  f.seek(0x100)
                  xci_sig = f.read(4)

              if any(sig.startswith(m) for m in archive_signatures):
                  ext_dir = work / f"ext_{label}"
                  ext_dir.mkdir(parents=True, exist_ok=True)
                  subprocess.run(["unar", "-o", str(ext_dir), str(source)], check=True)
                  found = [
                      p for p in ext_dir.rglob("*")
                      if p.is_file() and p.suffix.lower() in (".nsp", ".xci")
                  ]
                  if not found:
                      raise SystemExit(f"No .nsp or .xci found inside {label} archive.")
                  shutil.move(str(found[0]), str(pkg_dir / f"{label}{found[0].suffix.lower()}"))
              elif sig[:4] == b"PFS0":
                  shutil.move(str(source), str(pkg_dir / f"{label}.nsp"))
              elif xci_sig == b"HEAD":
                  shutil.move(str(source), str(pkg_dir / f"{label}.xci"))
              else:
                  raise SystemExit(f"Unsupported file format for {label}.")
          PY

          NCA_BASE="$WORK/nca_base"
          NCA_UPD="$WORK/nca_update"
          mkdir -p "$NCA_BASE" "$NCA_UPD"

          if [[ -f "$PKG_DIR/game.xci" ]]; then
            echo "Extracting base XCI..."
            hactool -k "$WORK/prod.keys" -t xci --securedir="$NCA_BASE" "$PKG_DIR/game.xci"
          elif [[ -f "$PKG_DIR/game.nsp" ]]; then
            echo "Extracting base NSP..."
            hactool -k "$WORK/prod.keys" -t pfs0 --pfs0dir="$NCA_BASE" "$PKG_DIR/game.nsp"
          fi

          if [[ -f "$PKG_DIR/update.xci" ]]; then
            echo "Extracting update XCI..."
            hactool -k "$WORK/prod.keys" -t xci --securedir="$NCA_UPD" "$PKG_DIR/update.xci"
          elif [[ -f "$PKG_DIR/update.nsp" ]]; then
            echo "Extracting update NSP..."
            hactool -k "$WORK/prod.keys" -t pfs0 --pfs0dir="$NCA_UPD" "$PKG_DIR/update.nsp"
          fi

          # 1. Extraer Program NCA (exefs y romfs)
          BASE_PROG_NCA="$(find "$NCA_BASE" -name "*.nca" -type f -exec ls -S {} + | head -n 1)"
          echo "Base Program NCA: $BASE_PROG_NCA"

          UPD_PROG_NCA=""
          if [[ -d "$NCA_UPD" ]]; then
            UPD_PROG_NCA="$(find "$NCA_UPD" -name "*.nca" -type f -exec ls -S {} + | head -n 1 || true)"
          fi

          if [[ -n "$UPD_PROG_NCA" ]]; then
            echo "Update Program NCA detected: $UPD_PROG_NCA"
            hactool -k "$WORK/prod.keys" --basenca="$BASE_PROG_NCA" "$UPD_PROG_NCA" \
              --exefsdir="$EXTRACTED_GAME/exefs" \
              --romfsdir="$EXTRACTED_GAME/romfs"
          else
            echo "Extracting directly from Base Program NCA..."
            hactool -k "$WORK/prod.keys" "$BASE_PROG_NCA" \
              --exefsdir="$EXTRACTED_GAME/exefs" \
              --romfsdir="$EXTRACTED_GAME/romfs"
          fi

          # 2. Extraer Control NCA (control.nacp e iconos)
          echo "Buscando y extrayendo Control NCA..."
          python - "$NCA_BASE" "$NCA_UPD" "$WORK/prod.keys" "$EXTRACTED_GAME" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          nca_base = Path(sys.argv[1])
          nca_upd = Path(sys.argv[2])
          keys_file = Path(sys.argv[3])
          out_dir = Path(sys.argv[4])

          all_ncas = []
          if nca_upd.exists():
              all_ncas.extend(sorted(nca_upd.glob("*.nca"), key=lambda p: p.stat().st_size))
          if nca_base.exists():
              all_ncas.extend(sorted(nca_base.glob("*.nca"), key=lambda p: p.stat().st_size))

          found_control = False
          for nca in all_ncas:
              size = nca.stat().st_size
              if 50_000 < size < 60_000_000:
                  temp_romfs = out_dir / "temp_control_romfs"
                  temp_romfs.mkdir(parents=True, exist_ok=True)
                  subprocess.run(
                      ["hactool", "-k", str(keys_file), f"--romfsdir={temp_romfs}", str(nca)],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )
                  nacp = temp_romfs / "control.nacp"
                  if nacp.exists() and nacp.stat().st_size > 0:
                      print(f"control.nacp encontrado en {nca.name}")
                      for item in temp_romfs.iterdir():
                          dest = out_dir / item.name
                          if item.is_file():
                              import shutil
                              shutil.copy2(item, dest)
                      import shutil
                      shutil.rmtree(temp_romfs, ignore_errors=True)
                      found_control = True
                      break
                  import shutil
                  shutil.rmtree(temp_romfs, ignore_errors=True)

          # Si no vino control.nacp, generar estructura de respaldo válida de 0x4000 bytes
          nacp_file = out_dir / "control.nacp"
          if not nacp_file.exists():
              print("Creando control.nacp de respaldo...")
              buf = bytearray(0x4000)
              title = b"Tomodachi Life: Living the Dream\x00"
              pub = b"Nintendo\x00"
              for i in range(16):
                  off = i * 0x300
                  buf[off:off+len(title)] = title
                  buf[off+0x200:off+0x200+len(pub)] = pub
              with open(nacp_file, "wb") as f:
                  f.write(buf)

          # Asegurar copia de icono estándar
          for icon in out_dir.glob("icon_*.dat"):
              import shutil
              shutil.copy2(icon, out_dir / "icon.jpg")
              shutil.copy2(icon, out_dir / "icon.png")
              break
          PY

          # 3. Preparar la estructura en el directorio de trabajo ~/TITLEID-work/data/v0
          TARGET_WORK_V0="${HOME}/${PROFILE_ID}-work/data/v0"
          mkdir -p "${HOME}/${PROFILE_ID}-work/data"
          rm -rf "$TARGET_WORK_V0"
          mkdir -p "$TARGET_WORK_V0"

          ln -sfn "$EXTRACTED_GAME/exefs" "$TARGET_WORK_V0/exefs"
          ln -sfn "$EXTRACTED_GAME/romfs" "$TARGET_WORK_V0/romfs"
          cp "$EXTRACTED_GAME"/control.nacp "$TARGET_WORK_V0/"
          cp "$EXTRACTED_GAME"/icon* "$TARGET_WORK_V0/" 2>/dev/null || true

          echo "DM_DISPLAY_NAME=Tomodachi Life: Living the Dream" >> "$GITHUB_ENV"

          if [[ ! -f "$EXTRACTED_GAME/exefs/main" ]]; then
            echo "::error::Failed to extract exefs/main."
            exit 1
          fi

          echo "Extraction and workspace configuration complete:"
          ls -la "$TARGET_WORK_V0"

      - name: Set Shader Profile and Update Toolchain Header
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_ID="${PROFILE_OVERRIDE:-010051F0207B2000}"
          PROFILE_ID="$(echo "$PROFILE_ID" | tr '[:lower:]' '[:upper:]')"

          export DM_GAME="$PROFILE_ID"
          export GAME="$PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "GAME=$PROFILE_ID" >> "$GITHUB_ENV"

          python dm/gfx/tools/dmsh_chain.py --update-lock
          python dm/gfx/tools/dmsh_chain.py --header

      - name: Build Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          EXTRACTED_GAME="$RUNNER_TEMP/ExtractedGame"
          OUTPUT_IPA="$RUNNER_TEMP/Tomodachi-Native.ipa"

          PROFILE_ID="${GAME:-010051F0207B2000}"
          export GAME="$PROFILE_ID"
          export DM_GAME="$PROFILE_ID"
          export DM_DISPLAY_NAME="Tomodachi Life: Living the Dream"
          export WORK_DIR="${HOME}/${PROFILE_ID}-work"
          export GAME_DIR="$EXTRACTED_GAME"
          export ROMFS_DIR="$EXTRACTED_GAME/romfs"
          export EXEFS_DIR="$EXTRACTED_GAME/exefs"
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGN_IDENTITY=""
          export CODE_SIGNING_REQUIRED=NO

          chmod +x dm/ios/tools/*.sh || true

          GAME="$PROFILE_ID" DM_DISPLAY_NAME="$DM_DISPLAY_NAME" bash dm/ios/tools/build_ipa.sh "$EXTRACTED_GAME"

          BUILT_IPA="$(find . "$RUNNER_TEMP" "$HOME" -name "*.ipa" -type f -not -path "*/ExtractedGame/*" -not -path "$OUTPUT_IPA" -print -quit)"

          if [[ -z "$BUILT_IPA" || ! -s "$BUILT_IPA" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          cp "$BUILT_IPA" "$OUTPUT_IPA"
          echo "IPA successfully created at: $OUTPUT_IPA"
          ls -lh "$OUTPUT_IPA"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tomodachi-Native-IPA
          path: ${{ runner.temp }}/Tomodachi-Native.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/Packages" \
            "$RUNNER_TEMP/ExtractedGame" \
            "${HOME}/${GAME:-010051F0207B2000}-work"
